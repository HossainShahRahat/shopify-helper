<!doctype html>
<html><head><meta charset="utf-8"><title>Shopify Helper settings</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #1f2430; }
  h2 { margin: 28px 0 10px; font-size: 16px; }
  .card { border: 1px solid #e3e6ee; border-radius: 12px; padding: 14px 16px; }
  .line { display: flex; gap: 12px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .rule { display: grid; grid-template-columns: auto 1fr 120px 46px auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef0f6; }
  input[type=text], select { padding: 7px 9px; border: 1px solid #d5d9e4; border-radius: 8px; font: inherit; }
  input[type=color] { width: 40px; height: 32px; border: 0; padding: 0; background: none; }
  button { padding: 6px 10px; border: 0; border-radius: 8px; background: #eef0f6; font: inherit; cursor: pointer; }
  button.primary { background: #5b6cff; color: #fff; }
  .hint { color: #6b7280; font-size: 12px; } #saved { color: #1d6b37; font-size: 12px; }
</style></head>
<body>
  <h1>Shopify Helper</h1>
  <h2>Theme</h2>
  <div class="card">
    <div class="line"><label><input type="checkbox" id="themeOn"> Enable theme</label>
      <label>Preset <select id="preset"><option value="clean">Clean light</option><option value="soft">Soft warm</option><option value="brand">Brand color</option></select></label></div>
    <div class="line"><label>Accent <input type="color" id="accent"></label>
      <label>Corner radius <input type="range" id="radius" min="0" max="24"> <span id="radiusVal"></span>px</label></div>
  </div>
  <h2>Missing books on order details</h2>
  <div class="card">
    <div class="line"><label><input type="checkbox" id="missingOn"> Read the order note and highlight matching items</label></div>
    <div class="line"><label>Trigger word <input type="text" id="missingKeyword" size="12"></label>
      <label>Highlight color <input type="color" id="missingColor"></label></div>
    <div class="hint">If the note contains the trigger word, book names written in the note are matched (similar spelling is fine) against the order's items and those rows get this color.</div>
  </div>
  <h2>Note rules <span class="hint">(top to bottom, first match wins; matching is case-insensitive)</span></h2>
  <div class="card"><div id="rules"></div><div class="line"><button class="primary" id="add">+ Add rule</button><span id="saved"></span></div></div>
  <script src="options.js"></script>
</body></html>
